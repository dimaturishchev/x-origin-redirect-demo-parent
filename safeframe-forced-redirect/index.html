<script>
    var i = document.createElement('iframe');
    i.src = "https://x-origin-redirect-demo.pages.dev/child/";
    i.width = "500px";
    i.height = "500px";
    // SafeFrame-style sandbox: grants allow-top-navigation-by-user-activation
    // (activation-gated) but NOT plain allow-top-navigation. A conforming engine
    // must therefore block the gesture-less top navigation the child attempts.
    i.setAttribute('sandbox', 'allow-forms allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation allow-presentation');
    document.body.appendChild(i);
</script>

</html>
